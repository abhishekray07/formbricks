verify_setup:
  instructions: |
    Fresh self-hosted Formbricks instance with no seeded users. Start at
    /auth/signup and register a new account (e.g. verify@opslane.dev with a
    strong password) — email verification is not enforced on a fresh
    self-hosted boot, so sign-up completes immediately. Then create the first
    organization/project when prompted before exercising acceptance criteria.
    The container self-migrates on boot via its start script.
notes: |
  Formbricks (Next.js monorepo). Dockerfile-first: apps/web/Dockerfile builds
  the production web app on port 3000; the image start script runs database
  migrations before serving. Recipe aliases: postgres at pg:5432 (app/app,
  database `app`), redis at redis:6379, smtp at smtp:2500 (TLS off).
