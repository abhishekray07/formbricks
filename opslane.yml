  session_command: node scripts/opslane-session.cjs
port: 3000
dockerfile: apps/web/Dockerfile
services: [postgres, redis, smtp]
health_path: /api/v2/health
env:
  NODE_ENV: production
  WEBAPP_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: 7ec9ac7ec5a2f696bdb22985d8759b113dfcf026ba8d6d311f8e6365fb7c9050
  ENCRYPTION_KEY: aa9cb7294ae7f0c65a93a5d51ac82794b4b75a4c05cd072f7f38b70c3510f478
  CRON_SECRET: 7465c2b8bd2b03e01d3c393ee4f3b669988b0209b0b1d18e9930762aa5817c0c
  CUBEJS_API_SECRET: 3f5f01e0238bcb5819297bbab193117491244509b8a5477864d29ecda8e66446
  DATABASE_URL: postgresql://app:app@pg:5432/app?schema=public
  REDIS_URL: redis://redis:6379
  MAIL_FROM: noreply@formbricks.local
